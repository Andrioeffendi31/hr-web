# Pengingat lokasi untuk PWA iOS — lihat src/app/api/cron/ping-ios/route.ts.
#
# Di sini, bukan di vercel.json: cron Vercel Hobby hanya boleh sekali sehari.
# Endpoint-nya sendiri yang memutuskan siapa yang sudah waktunya diingatkan,
# jadi jadwal GitHub yang molor beberapa menit (biasa terjadi) tidak masalah.
name: Pengingat lokasi iOS

on:
  schedule:
    # tiap 30 menit, 00:00–14:59 UTC = 07:00–21:59 WIB. Di luar jam itu tidak
    # ada yang sedang absen masuk, dan tiap panggilan tetap memakan CPU Vercel.
    - cron: "*/30 0-14 * * *"
  workflow_dispatch:

concurrency:
  group: ping-ios
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Panggil endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://hr-web-prod-app-v1.vercel.app/api/cron/ping-ios
